<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>003 · Recovery flow</title>
<link rel="stylesheet" href="../themes/default.css">
<link rel="stylesheet" href="../_shared/base.css?v=3">
<link rel="stylesheet" href="../_shared/shell.css?v=3">
<style>
  .b-detail > * { max-width: 680px; }
  .card { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: var(--space-3) var(--space-4); }
  .fid { cursor: help; }
  .fid.partial { background: var(--color-accent-bg); color: #c77700; }
  .fid.absent { background: var(--color-danger-bg); color: var(--color-danger); }
  table.targets { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  table.targets td { padding: 7px 4px; border-top: 0.5px solid var(--color-separator); vertical-align: middle; }
  table.targets tr:first-child td { border-top: 0; }
  table.targets td.main { width: 100%; }
  table.targets tr.hit td { background: var(--color-selection); }
  table.targets tr.left-out td { opacity: .5; }
  table.targets .move { white-space: nowrap; color: var(--color-text-muted); }
  table.targets .tick { width: 18px; text-align: center; }
  .spin { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--color-border); border-top-color: var(--color-primary); animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .panel { margin-top: var(--space-4); border-radius: var(--radius-lg); box-shadow: 0 0 0 1.5px var(--color-primary), var(--shadow-md); background: var(--color-surface); padding: var(--space-3) var(--space-4); animation: drop .18s ease; }
  @keyframes drop { from { transform: translateY(-6px); opacity: 0; } }
  .step { font-size: var(--text-xs); font-weight: 600; color: var(--color-primary); text-transform: uppercase; letter-spacing: .04em; margin-bottom: var(--space-2); }
  .banner.ok { background: var(--color-success-bg); }
  .prompt { display: flex; gap: var(--space-2); align-items: center; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--color-surface-2); box-shadow: inset 0 0 0 0.5px var(--color-border); font-size: var(--text-base); }
  .prompt .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  code.call { font: 12px var(--font-mono); background: var(--color-neutral-bg); padding: 2px 6px; border-radius: 4px; overflow-wrap: anywhere; }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px var(--space-3); font-size: var(--text-sm); color: var(--color-text-muted); margin-top: var(--space-3); }
  .meter { height: 6px; border-radius: 3px; background: var(--color-neutral-bg); overflow: hidden; margin-top: 6px; }
  .meter span { display: block; height: 100%; background: var(--color-primary); }
</style>
</head>
<body>
<div id="sketch-root">
  <section class="variant" id="variant-a" data-label="A: Undo here — preview, then confirm"><div class="b-shell"></div></section>
  <section class="variant" id="variant-b" data-label="B: Read-only — ask Claude to undo"><div class="b-shell"></div></section>
  <section class="variant" id="variant-c" data-label="C: Backup files — manual recovery"><div class="b-shell"></div></section>
  <section class="variant" id="variant-d" data-label="D: B + C — read-only" data-winner><div class="b-shell"></div></section>
</div>

<script src="../_shared/data.js?v=3"></script>
<script src="../_shared/sketch.js?v=3"></script>
<script src="../_shared/shell.js?v=3"></script>
<script>
const D = DATA, F = fmt, H = Shell.header;
const START = "2026-09-28T09:40:12"; // trash_mail: 6 newsletters, 2 partial backups
const shells = {};

// ---------- shared pieces ----------
const FID = {
  full: "Full copy, attachments included.",
  partial: "Body complete, attachments missing — Mail had not downloaded them.",
  absent: "No local copy — only the server copy exists.",
};
const fidChip = (f) => `<span class="chip fid ${f}" title="${FID[f]}">${f === "absent" ? "no backup" : f}</span>`;
const receiptOf = (e) => e.receipt && D.receipts[e.receipt];
const back = (r) => r.targets.filter((t) => t.status === "ok");
const from = (r) => [...new Set(r.targets.map((t) => t.folder))].join(", ");
function summaryLine(r) {
  const s = F.receiptStats(r);
  return `<b>${s.ok} of ${s.n}</b> moved from ${from(r)} to <b>${r.destination}</b> · ${[...new Set(r.targets.map((t) => F.account(t.account)))].join(", ")} · ${s.full} full backups${s.lossy ? `, ${s.lossy} partial or none` : ""}`;
}
function table(r, { query = "", cols }) {
  return `<table class="targets">${r.targets.map((t, i) => {
    const hit = query && t.summary.toLowerCase().includes(query);
    return `<tr class="${hit ? "hit" : ""}${t.status !== "ok" ? " left-out" : ""}">${cols(t, i)}</tr>`;
  }).join("")}</table>`;
}
const leftOutNote = (r) => {
  const n = r.targets.filter((t) => t.status !== "ok").length;
  return n ? `<p class="muted" style="font-size:var(--text-sm)">${n} message ${n > 1 ? "are" : "is"} left out: ${n > 1 ? "they were" : "it was"} missing when the batch ran, so ${n > 1 ? "they" : "it"} never moved.</p>` : "";
};
function nonBatch(e, box) {
  box.innerHTML = `${H(e)}
    ${e.before && e.after ? `<div class="card">${e.before.summary} → <b>${e.after.summary}</b></div>` : ""}
    <div class="banner"><span>ⓘ</span><div><b>No backup for this write.</b> Recovery covers batch Mail writes — move, trash and dedupe. To reverse this, open it in ${e.app}, or ask Claude to change it back.</div></div>
    <div class="actions">${(e.after || e.before) ? `<button class="btn" onclick="toast('Opens ${e.app}')">Open in ${e.app}</button>` : ""}</div>`;
}
function undoRecord(e, box) {
  const orig = D.audit.find((x) => x.receipt === e.args.receipt);
  box.innerHTML = `${H(e)}
    <div class="banner ok"><span>↺</span><div>This undo moved the messages of an earlier batch back to where they came from${e.caller ? `. Run by <b>${e.caller}</b>` : ""}.</div></div>
    <dl class="kv"><dt>Receipt</dt><dd class="mono">${e.receipt}</dd><dt>Undid</dt><dd class="mono">${e.args.receipt}</dd></dl>
    <div class="actions">${orig ? `<button class="btn" data-go="${orig.ts}">Show the original batch</button>` : ""}</div>`;
}
let clock = 0;
function markUndone(e, r, caller) {
  const ts = `2026-09-28T09:5${clock++}:07`;
  const rid = `20260928-095${clock}07-33281${clock}-001-undo`;
  D.audit.unshift({ ts, tool: "mail_undo", op: "undo", tier: "destructive", app: "Mail", caller,
    args: { receipt: e.receipt, dry_run: false }, receipt: rid,
    summary: `Undo of the ${r.op}: ${back(r).length} messages moved back to ${from(r)}` });
  e.undone_by = r.undone_by = rid;
  Object.values(shells).forEach((s) => s.refresh());
}
function dispatch(render, key) {
  return (e, box, ctx) => {
    if (e.tool === "mail_undo") undoRecord(e, box);
    else if (!receiptOf(e)) nonBatch(e, box);
    else render(e, receiptOf(e), box, ctx);
    box.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => shells[key].select(b.dataset.go));
  };
}
const undoneBanner = (e) => {
  const u = D.audit.find((x) => x.receipt === e.undone_by);
  return `<div class="banner ok"><span>✓</span><div><b>Undone${u ? ` ${F.day(u.ts).toLowerCase()} at ${F.time(u.ts)}` : ""}${u && u.caller ? ` by ${u.caller}` : ""}.</b> The messages are back in ${from(receiptOf(e))}. <button class="btn link" data-go="${u ? u.ts : ""}">Show the undo</button></div></div>`;
};

// ---------- A: undo here — preview, then confirm ----------
const aState = {};
function recoverA(e, r, box, { query } = {}) {
  const st = e.undone_by ? "done" : aState[e.receipt] || "idle";
  const n = back(r).length;
  const cols = (t, i) => {
    const tick = st === "running" ? (i < aState.progress ? "✓" : `<span class="spin"></span>`) : st === "preview" || st === "running" ? "" : "";
    return `<td class="main">${t.summary}<div class="faint">${F.account(t.account)}</div></td>
      ${st === "preview" || st === "running" ? `<td class="move">${t.status === "ok" ? `${r.destination} → <b>${t.folder}</b>` : "stays"}</td><td class="tick">${t.status === "ok" ? tick : ""}</td>`
        : `<td>${fidChip(t.fidelity)}</td><td>${t.status === "ok" ? `<span class="chip ok">moved</span>` : `<span class="chip danger">${t.status}</span>`}</td>`}`;
  };
  let panel = "";
  if (st === "idle") panel = `<div class="actions"><button class="btn primary" data-a="preview">Undo…</button><button class="btn" onclick="toast('Opens Trash in Mail')">Show in Mail</button></div>`;
  if (st === "preview" || st === "running") panel = `<div class="panel">
      <div class="step">${st === "preview" ? "Preview — nothing has moved yet" : `Moving… ${Math.min(aState.progress, n)} of ${n}`}</div>
      ${table(r, { query, cols })}${leftOutNote(r)}
      <p class="muted" style="font-size:var(--text-sm);margin:var(--space-2) 0 0">Runs <code class="call">mail_undo(dry_run=false)</code> from this page. It is logged in audit.jsonl with caller <b>dashboard</b>.</p>
      <div class="actions"><button class="btn" data-a="cancel" ${st === "running" ? "disabled" : ""}>Cancel</button><button class="btn primary" data-a="run" ${st === "running" ? "disabled" : ""}>Move ${n} back to ${from(r)}</button></div></div>`;
  box.innerHTML = `${H(e)}
    ${st === "done" ? undoneBanner(e) : ""}
    <div class="card"><p style="margin:0 0 var(--space-2)">${summaryLine(r)}</p>${st === "preview" || st === "running" ? "" : table(r, { query, cols })}</div>
    ${panel}`;
  box.querySelectorAll("[data-a]").forEach((b) => b.onclick = () => {
    const a = b.dataset.a;
    if (a === "preview") aState[e.receipt] = "preview";
    if (a === "cancel") aState[e.receipt] = "idle";
    if (a === "run") {
      aState[e.receipt] = "running"; aState.progress = 0;
      const tick = setInterval(() => {
        aState.progress++;
        if (aState.progress > n) { clearInterval(tick); delete aState[e.receipt]; markUndone(e, r, "dashboard"); toast(`${n} messages moved back to ${from(r)}`); return; }
        recoverA(e, r, box, { query });
      }, 280);
    }
    recoverA(e, r, box, { query });
  });
}

// ---------- B: read-only — ask Claude ----------
const bWaiting = {};
function recoverB(e, r, box, { query } = {}, again = recoverB) {
  const cols = (t) => `<td class="main">${t.summary}<div class="faint">${F.account(t.account)} · from ${t.folder}</div></td><td>${fidChip(t.fidelity)}</td><td>${t.status === "ok" ? `<span class="chip ok">moved</span>` : `<span class="chip danger">${t.status}</span>`}</td>`;
  const ask = `Undo mail receipt ${e.receipt}`;
  box.innerHTML = `${H(e)}
    ${e.undone_by ? undoneBanner(e) : ""}
    <div class="card"><p style="margin:0 0 var(--space-2)">${summaryLine(r)}</p>${table(r, { query, cols })}${leftOutNote(r)}</div>
    ${e.undone_by ? "" : `<div class="section-label">To undo, ask Claude</div>
    <div class="prompt"><span class="grow">${ask}</span><button class="btn" data-b="copy">Copy</button></div>
    <p class="muted" style="font-size:var(--text-sm)">Claude runs <code class="call">mail_undo</code> as a preview first, then moves the messages back after you confirm. This page only reads — writes stay in the MCP path, where they are gated and audited.</p>
    <details class="raw"><summary class="muted" style="cursor:pointer;font-size:var(--text-sm)">Exact tool call</summary><p><code class="call">mail_undo(receipt="${e.receipt}", dry_run=false)</code></p></details>
    ${bWaiting[e.receipt] ? `<div class="banner"><span class="spin"></span><div>Watching audit.jsonl for the undo… this page updates when it lands. <button class="btn link" data-b="sim">Sketch: simulate Claude running it</button></div></div>` : ""}`}`;
  box.querySelectorAll("[data-b]").forEach((b) => b.onclick = () => {
    if (b.dataset.b === "copy") { navigator.clipboard?.writeText(ask); toast("Copied — paste it into Claude"); bWaiting[e.receipt] = true; }
    if (b.dataset.b === "sim") { delete bWaiting[e.receipt]; markUndone(e, r, "Claude (mail_undo)"); toast("The undo landed in audit.jsonl"); return; }
    again(e, r, box, { query });
  });
}

// ---------- C: backup files — manual recovery ----------
const kb = (i) => [38, 12, 204, 9, 61, 27, 18, 44, 7, 0, 33, 15][i % 12];
function recoverC(e, r, box, { query } = {}) {
  const cols = (t, i) => `<td class="main">${t.summary}<div class="faint mono">${t.fidelity === "absent" ? "no file" : `${48120 + i}.eml · ${kb(i)} KB`}</div></td>
    <td>${fidChip(t.fidelity)}</td>
    <td style="white-space:nowrap">${t.fidelity === "absent" ? "" : `<button class="btn" onclick="toast('Opens ${48120 + i}.eml in Mail — drag it to a mailbox to restore')">Open</button> <button class="btn" onclick="toast('Reveals ${48120 + i}.eml in Finder')">Reveal</button>`}</td>`;
  box.innerHTML = `${H(e)}
    <div class="banner"><span>ⓘ</span><div>${e.undone_by ? "This batch was undone; the backup files are still kept." : `The server still has these messages in <b>${r.destination}</b> — an undo is the easy way back. Use the files when the server copy is gone.`}</div></div>
    <div class="card"><p style="margin:0 0 var(--space-2)">${summaryLine(r)}</p>${table(r, { query, cols })}</div>
    <div class="legend">${fidChip("full")}<span>${FID.full}</span>${fidChip("partial")}<span>${FID.partial}</span>${fidChip("absent")}<span>${FID.absent}</span></div>
    <div class="actions"><button class="btn" onclick="toast('Reveals the receipt folder in Finder')">Reveal folder</button><span class="muted mono" style="font-size:var(--text-xs);align-self:center">${r.backup_dir}</span></div>`;
}
// ---------- D: B + C — read-only: C's files per message, then B's ask-Claude ----------
function recoverD(e, r, box, ctx = {}) {
  recoverB(e, r, box, ctx, recoverD);
  const c = document.createElement("div");
  recoverC(e, r, c, ctx);
  const card = box.querySelector(".card");
  card.replaceWith(c.querySelector(".card"));
  box.append(c.querySelector(".legend"), c.querySelector(".actions"));
}

const backupsPage = {
  label: "Backups", group: "System", badge: `${D.backups.mb} MB`,
  render: (b, nav) => {
    const rows = Object.entries(D.receipts).map(([rid, r]) => {
      const e = D.audit.find((x) => x.receipt === rid);
      return `<div class="row clickable" data-go="${e.ts}">${F.appico("Mail")}<div class="grow"><div class="title">${r.op} · ${r.targets.length} messages</div><div class="sub mono">${rid}</div></div><span class="muted">${(r.targets.length * 0.04).toFixed(1)} MB</span></div>`;
    }).join("");
    b.innerHTML = `<h1>Backups</h1><p class="lede">Every batch Mail write copies its messages to disk first. Nothing here is ever pruned.</p>
      <div class="group"><div class="row"><div class="grow"><div class="title">${D.backups.mb} MB in ${D.backups.receipts} receipts</div><div class="sub">oldest ${D.backups.oldest} · advisory limit 1 GB (MACOS_APPS_BACKUP_LIMIT)</div><div class="meter"><span style="width:${(D.backups.mb / 1024) * 100}%"></span></div></div><button class="btn" onclick="toast('Reveals &lt;state&gt;/backup/mail in Finder')">Reveal</button></div></div>
      <div class="group-title">Receipts</div><div class="group">${rows}<div class="row"><span class="muted">and ${D.backups.receipts - 3} older receipts</span></div></div>`;
    b.querySelectorAll("[data-go]").forEach((row) => row.onclick = () => nav.select(row.dataset.go));
  },
};

shells.a = Shell.mount(document.querySelector("#variant-a .b-shell"), { detail: dispatch(recoverA, "a"), select: START });
shells.b = Shell.mount(document.querySelector("#variant-b .b-shell"), { detail: dispatch(recoverB, "b"), select: START });
shells.c = Shell.mount(document.querySelector("#variant-c .b-shell"), { detail: dispatch(recoverC, "c"), select: START, pages: { backups: backupsPage } });
shells.d = Shell.mount(document.querySelector("#variant-d .b-shell"), { detail: dispatch(recoverD, "d"), select: START, pages: { backups: backupsPage } });
</script>
</body>
</html>
