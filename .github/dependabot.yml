version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule: { interval: "weekly" }
    versioning-strategy: lockfile-only   # keep the deliberate caps (#286, #322); only uv.lock moves
    cooldown: { default-days: 3 }
    groups:
      uv:
        patterns: ["*"]
      uv-security:
        applies-to: security-updates     # without this, security PRs stay one per package
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      actions:
        patterns: ["*"]
