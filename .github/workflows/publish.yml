name: Publish

# Two triggers, one workflow:
#   - push to main      -> auto-publish to TestPyPI
#   - workflow_dispatch -> pick target manually (testpypi or pypi)
#
# Production PyPI stays gated behind manual dispatch — uploads are permanent
# and `target=pypi` should be a deliberate human action. Trusted Publishing
# (OIDC) handles auth for both indexes — no API tokens stored.
#
# Runner is macos-latest (not lintle's ubuntu): PyObjC/EventKit are macOS-only,
# so `uv sync` + pytest can't run on Linux. The built wheel is still pure-Python.
#
# `main` is release-only (develop is the trunk), so a push to main is a
# per-release event — the TestPyPI publish never fires on ordinary feature work.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

jobs:
  publish:
    runs-on: macos-latest
    environment:
      name: pypi
      url: ${{ inputs.target == 'pypi' && 'https://pypi.org/project/macos-apps-mcp/' || 'https://test.pypi.org/project/macos-apps-mcp/' }}
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7

      # Production publishes only from the release tag that matches the package version: a
      # target=pypi dispatch on a branch would otherwise upload a non-release build for good.
      - name: Refuse a production publish off a matching release tag
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::target=pypi needs the tag v$version; this run is on $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Verify before publishing
        run: |
          uv sync --locked
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .

      - name: Build sdist and wheel
        run: uv build

      # inputs.target is unset on push events, so a push to main lands here.
      - name: Publish to TestPyPI
        if: github.event_name == 'push' || inputs.target == 'testpypi'
        run: uv publish --index testpypi --trusted-publishing always

      # PyPI only on explicit dispatch — never on a push event.
      - name: Publish to PyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
        run: uv publish --trusted-publishing always

      # After PyPI: the registry checks that this version is on PyPI. mcp-publisher is pinned and
      # hash-checked because of the repo's 3-day dependency cooldown; the sha256 is GitHub's asset
      # digest for v1.8.1, and the arm64 build matches macos-latest. Only the binary is extracted,
      # outside the checkout (the archive also holds a README.md and LICENSE).
      - name: Publish to the MCP Registry
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_darwin_arm64.tar.gz
          echo "e45e520892460732a4bdf37255576415d4a53ec171f8b913faf15bb1aef7cb77  $RUNNER_TEMP/mcp-publisher.tar.gz" | shasum -a 256 -c
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
