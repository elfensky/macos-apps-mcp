# CodeQL, advanced setup (2026-11-19). The default setup takes no configuration, and the
# throwaway probes and spike servers under .planning/ made "high" alerts on every release PR.
# They are not part of the package, so the scan leaves that folder out. Product code, the
# tests and the workflows are still scanned.
name: CodeQL

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the results
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - .planning
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
