name: ci

# Two jobs. `check` (macos-latest) runs lint + format, then the whole suite twice; the ruff steps
# run before pytest, so a lint failure stops the job early, and integration/TCC tests never run in
# CI (the default pytest addopts deselect them). `linux-tools-list` (ubuntu-latest) proves the
# server installs, imports and lists its tools on Linux, which is Glama's build test, so a future
# load-time macOS import breaks CI. Lint-gate practice imported from the sibling repos (lintle,
# descent-engine); no Python-version matrix to fan a shared lint leg across.
# The suite runs twice: default, then MACOS_APPS_READ_ONLY=1 — a read-only deployment's tests must
# stay green (GATE-07), and the read-only debt has grown unseen before (01-13).

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: MACOS_APPS_READ_ONLY=1 uv run pytest

  linux-tools-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run python -c "import macos_apps_mcp.server"
      - run: uv run pytest tests/test_tools_list_anywhere.py
