[project]
name = "macos-apps-mcp"
version = "0.14.3"
description = "One consolidated MCP server for native macOS apps (Calendar, Reminders, Mail, ...)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrei Lavrenov", email = "andrei@lav.ren" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "macos",
    "apple",
    "eventkit",
    "calendar",
    "reminders",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "fastmcp>=2.0,<4",                    # <4: tested major (#286)
    "anyio>=4",                           # imported directly (audit.py)
    "mcp>=1.26,<2",                       # imported directly (server.py: mcp.types); <2: tested major (#286)
    "pyobjc-framework-EventKit>=10.0",    # Calendar + Reminders (v1)
    "pyobjc-framework-Cocoa>=10.0",       # Foundation, imported directly (runtime.py)
    "pyobjc-framework-ServiceManagement>=10.0",  # SMAppService agent registration (deploy.py)
    "uvicorn>=0.30",                      # imported directly (daemon.py: fd-based UDS serving)
    "httpx>=0.27",                        # imported directly (daemon.py: shim's UDS transport)
    # #322: transitive (mcp -> pyjwt[crypto]), never imported; 49+ has no Intel macOS wheel
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Photos (D-01): library read at rest + export; <0.78: 0.x, export defaults gate D-09
    "osxphotos>=0.77.2,<0.78",
    # D-16: utitools needs it; its own line carries platform_release, which the bundle install drops
    "pyobjc-framework-uniformtypeidentifiers>=10.0",
]
# Contacts (#15) uses osascript/Automation (Contacts.app AppleScript dictionary), not the
# Contacts framework — a non-bundled server can't get CNContactStore TCC, but Automation works.

# Photos (D-01, D-16): osxphotos 0.77.2 resolved on macOS 27 (2026-10-18) with no existing pin
# moved except the five pairs that served only Python 3.11 or the collapsed win32 fork; the route
# is the Python 3.12 floor: osxphotos caps pyobjc<10 only on Python 3.11 with macOS < 13 (a
# platform_release marker), and uv's universal lock cannot split that from our pyobjc>=10.

[project.scripts]
macos-apps-mcp = "macos_apps_mcp:main"

[project.urls]
Homepage = "https://github.com/elfensky/macos-apps-mcp"
Repository = "https://github.com/elfensky/macos-apps-mcp"
Issues = "https://github.com/elfensky/macos-apps-mcp/issues"
Changelog = "https://github.com/elfensky/macos-apps-mcp/blob/main/CHANGELOG.md"

# Dev deps with >=major,<next pins mirror the sibling repos' uv discipline (lintle, descent-engine).
# Runtime deps stay unbounded above except mcp/fastmcp, capped at the majors CI tests:
# the shim's #170 wrapper is mcp-1.x-only (#286). The second exception is cryptography<49
# on Intel Macs only (#322): 49+ ships no Intel macOS wheel. The third is osxphotos<0.78
# (0.x; its export must never start a download, D-09). Other caps once downgraded
# EventKit/fastmcp, so do not add more.
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "python-dateutil>=2.9.0.post0",
    "ruff>=0.15,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["macos_apps_mcp"]

# ruff config imported verbatim from the sibling repos (same rule set + line length for cross-repo
# consistency). No src= (macos-apps-mcp is flat-layout, not src/). No mypy — neither sibling uses one.
[tool.ruff]
target-version = "py311"
line-length = 88
# ruff 0.16 formats Python code blocks inside markdown; docs/superpowers/ and the GSD
# planning records under .planning/ are frozen — leave their snippets as written.
exclude = ["docs/", ".planning/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real macOS / EventKit / TCC — run manually, never in CI"]
addopts = "-m 'not integration'"

# TestPyPI as a named publish target. `explicit = true` keeps it out of normal
# dependency resolution — it is only ever used via `uv publish --index testpypi`.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
